<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Flow | บันทึกการรักษา (OPD)</title>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/records.css">
  <link rel="stylesheet" href="/css/app-ui.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css?v=2">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">🏥 Clinic Flow</div>
    <ul class="sidebar-menu">
      <li><a href="/dashboard.html">📊 หน้าหลัก (Dashboard)</a></li>
      <li><a href="/patients.html">👥 ผู้ป่วย (Patients)</a></li>
      <li><a href="/records.html" class="active">📋 บันทึกการรักษา (OPD)</a></li>
      <li><a href="/inventory.html">💊 คลังยา (Inventory)</a></li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <h1>ประวัติการตรวจรักษา (OPD)</h1>
      <button class="btn btn-danger" id="logoutButton">ออกจากระบบ</button>
    </header>

    <div class="content-area">
      <div class="action-bar">
        <div class="patient-select-group">
          <label for="patientSelect"><strong>เลือกผู้ป่วย:</strong></label>
          <select id="patientSelect" class="select-input" onchange="fetchPatientRecords()">
            <option value="">-- กรุณาเลือกผู้ป่วยเพื่อดูประวัติ --</option>
          </select>
        </div>
        <a href="/doctor.html" id="workspaceLink" class="btn btn-primary">กลับไปหน้าทำงาน</a>
      </div>

      <div id="recordsContainer">
        <div style="text-align: center; color: #64748b; padding: 40px; background: #fff; border-radius: 8px;">
          กรุณาเลือกผู้ป่วยจากรายการด้านบนเพื่อเรียกดูประวัติการตรวจรักษา
        </div>
      </div>
    </div>
  </div>

  <script src="/js/patient-metrics.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';

    let availableMedicines = [];
    let patientsList = [];

    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/';
    });

    async function loadMasterData() {
      try {
        // ดึงข้อมูลผู้ป่วย
        const pRes = await fetch('/api/patients?limit=1000', { headers: { 'Authorization': `Bearer ${token}` } });
        const pData = await pRes.json();
        patientsList = pData.data || [];

        const pSelect = document.getElementById('patientSelect');

        
        const optionsHtml = '<option value="">-- เลือกผู้ป่วย --</option>' + 
          patientsList.map(p => `<option value="${p.id}">${p.hn_code} - ${p.prefix || ''}${p.first_name} ${p.last_name}</option>`).join('');
        
        pSelect.innerHTML = optionsHtml;


        // ดึงรายการยา
        const mRes = await fetch('/api/medicines', { headers: { 'Authorization': `Bearer ${token}` } });
        const mData = await mRes.json();
        availableMedicines = mData.data || [];
      } catch (err) {
        console.error('Error loading master data:', err);
      }
    }

    async function fetchPatientRecords() {
      const patientId = document.getElementById('patientSelect').value;
      const container = document.getElementById('recordsContainer');

      if (!patientId) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px; background: #fff; border-radius: 8px;">กรุณาเลือกผู้ป่วยจากรายการด้านบนเพื่อเรียกดูประวัติการตรวจรักษา</div>';
        return;
      }

      try {
        const res = await fetch(`/api/records/patient/${patientId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();
        const records = result.data || [];

        if (records.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px; background: #fff; border-radius: 8px;">ไม่พบประวัติการตรวจรักษาของผู้ป่วยรายนี้</div>';
          return;
        }

        container.innerHTML = records.map(r => {
          let vs = {};
          try {
            vs = typeof r.vital_signs === 'string' ? JSON.parse(r.vital_signs) : (r.vital_signs || {});
          } catch(e) {}

          const prescriptionsHtml = (r.prescriptions && r.prescriptions.length > 0) ? `
            <table class="prescription-table">
              <thead>
                <tr>
                  <th>ชื่อยา</th>
                  <th>จำนวน</th>
                  <th>วิธีรับประทาน / คำแนะนำ</th>
                </tr>
              </thead>
              <tbody>
                ${r.prescriptions.map(p => `
                  <tr>
                    <td><strong>${p.medicine_name}</strong></td>
                    <td>${p.quantity} ${p.unit || ''}</td>
                    <td>${p.dosage_instructions || '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<p style="font-size:13px; color:#94a3b8; margin-top:8px;">ไม่มีรายการสั่งจ่ายยา</p>';

          return `
            <div class="record-card">
              <div class="record-header">
                <span><strong>วันที่ตรวจ:</strong> ${new Date(r.visit_date).toLocaleString('th-TH')}</span>
                <span><strong>แพทย์ผู้ตรวจ:</strong> ${r.doctor_name || '-'}</span>
              </div>
              
              <div style="margin-bottom: 8px;">
                ${vs.bp ? `<span class="vital-badge">BP: ${vs.bp}</span>` : ''}
                ${vs.pulse ? `<span class="vital-badge">Pulse: ${vs.pulse}</span>` : ''}
                ${vs.temp ? `<span class="vital-badge">Temp: ${vs.temp} °C</span>` : ''}
                ${vs.weight_kg != null ? `<span class="vital-badge">น้ำหนัก: ${Number(vs.weight_kg)} กก.</span>` : ''}
                ${vs.height_cm != null ? `<span class="vital-badge">ส่วนสูง: ${Number(vs.height_cm)} ซม.</span>` : ''}
                ${PatientMetrics.bmi(vs.weight_kg, vs.height_cm) !== null ? `<span class="vital-badge">BMI: ${PatientMetrics.bmi(vs.weight_kg, vs.height_cm).toFixed(1)}</span>` : ''}
              </div>

              <p style="margin: 4px 0; font-size:14px;"><strong>อาการสำคัญ:</strong> ${r.symptoms || '-'}</p>
              <p style="margin: 4px 0; font-size:14px; color:#0284c7;"><strong>การวินิจฉัย:</strong> ${r.diagnosis}</p>
              <p style="margin: 4px 0; font-size:14px;"><strong>คำสั่งการรักษา:</strong> ${r.treatment_notes || '-'}</p>
              ${r.allergy_override ? `<p class="flag warn" style="margin: 6px 0;"><strong>⚠ แพทย์ยืนยันสั่งยาที่ผู้ป่วยมีประวัติแพ้</strong> · เหตุผล: ${r.allergy_override}</p>` : ''}

              ${prescriptionsHtml}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div style="color:red; text-align:center;">เกิดข้อผิดพลาดในการโหลดข้อมูลประวัติการรักษา</div>';
      }
    }

    loadMasterData();
  </script>
<script src="/js/role-navigation.js"></script>
<script src="/js/app-ui.js?v=2"></script>
</body>
</html>
