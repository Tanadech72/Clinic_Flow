<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Flow | เข้าสู่ระบบ</title>

  <link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/theme.css?v=1">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <h1>Clinic Flow</h1>
      <p>ระบบจัดการคลินิก</p>

      <form id="loginForm">
        <label for="username">ชื่อผู้ใช้งาน</label>
        <input
          type="text"
          id="username"
          placeholder="กรอกชื่อผู้ใช้งาน"
          required
        >

        <label for="password">รหัสผ่าน</label>
        <input
          type="password"
          id="password"
          placeholder="กรอกรหัสผ่าน"
          required
        >

        <button type="submit">เข้าสู่ระบบ</button>
        <p id="message"></p>
      </form>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
